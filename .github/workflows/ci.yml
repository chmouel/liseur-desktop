name: CI

on:
  push:
    branches: [main]
  pull_request:

# Continuous integration reads the code and reports on it. It has no business
# writing anything, so it is given no permission to.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to a commit, not a tag. A tag can be moved to
      # point at different code by whoever controls the repository — or by
      # whoever steals the account — and these actions run with access to this
      # workflow's token and secrets. Dependabot proposes the updates, and the
      # trailing comment says which version each commit corresponds to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # electron-builder/electron postinstall downloads a binary; pnpm blocks
      # build scripts by default — allow only what we explicitly need.
      - run: pnpm rebuild electron esbuild

      - name: Known vulnerabilities
        run: pnpm audit --audit-level high

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

      - run: pnpm test

      - run: pnpm build

      - name: Install headless Electron deps
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgtk-3-0 libgbm1 libasound2t64

      - name: E2E tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm test:e2e

  # A change to the lockfile is the one way a supply-chain attack reaches this
  # project, so it gets read out loud rather than scrolled past.
  lockfile:
    name: Lockfile change
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compare against the base branch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          if git diff --quiet "$BASE" HEAD -- pnpm-lock.yaml; then
            echo "The lockfile is untouched." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A lockfile that moves on its own, with no change to the
          # dependencies that are actually asked for, is the shape of both an
          # accident and an attack. Dependabot is exempt: moving the lockfile
          # while pinning a transitive dependency is precisely its job.
          if git diff --quiet "$BASE" HEAD -- package.json && [ "$AUTHOR" != "dependabot[bot]" ]; then
            echo "::error::pnpm-lock.yaml changed but package.json did not. If this is deliberate, say so in the pull request; if it is not, check where it came from."
            exit 1
          fi

          git show "$BASE:pnpm-lock.yaml" > /tmp/base-lock.yaml 2>/dev/null || : > /tmp/base-lock.yaml
          node scripts/check-lockfile-change.mjs /tmp/base-lock.yaml pnpm-lock.yaml | tee -a "$GITHUB_STEP_SUMMARY"

  # The Homebrew cask is Ruby that nothing else in this repository can check,
  # and a mistake in it is only discovered by somebody trying to install the
  # application. Homebrew's own linter reads it, but only when it has changed:
  # the check costs a minute of gem installation, and the cask is touched a
  # few times a year.
  cask:
    name: Homebrew cask
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Style
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        run: |
          set -euo pipefail

          if git diff --quiet "$BASE" HEAD -- Casks; then
            echo "The cask is untouched." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! command -v brew > /dev/null; then
            echo "::warning::no Homebrew on this runner, the cask was not checked"
            exit 0
          fi

          brew style Casks/liseur.rb
