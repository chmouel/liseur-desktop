name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # electron-builder/electron postinstall downloads a binary; pnpm blocks
      # build scripts by default — allow only what we explicitly need.
      - run: pnpm rebuild electron esbuild

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

      - run: pnpm test

      - run: pnpm build

      - name: Install headless Electron deps
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgtk-3-0 libgbm1 libasound2t64

      - name: E2E tests
        run: xvfb-run --auto-servernum pnpm test:e2e
