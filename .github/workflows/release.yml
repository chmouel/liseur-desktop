name: Release

# Pushing a version tag builds the downloadable applications and publishes
# them. Nothing here runs on ordinary pushes: releases are deliberate.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag is the single source of truth for the version. package.json is
# rewritten from it during the build, so the number on the download and the
# number in the About box can never disagree.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (dry run, nothing is published)'
        required: true

# Nothing is granted wholesale. Only the job that publishes gets the right to
# write, and only it gets the tokens that sign for provenance; a compromised
# action in the build matrix therefore cannot touch a release.
permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild electron esbuild

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

      - name: Install headless Electron deps
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgtk-3-0 libgbm1 libasound2t64

      - name: E2E tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm test:e2e

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both architectures come off one runner per platform: the app has
          # no native modules, so nothing needs compiling for the target.
          - os: ubuntu-latest
            platform: linux
            flags: --linux
          - os: macos-latest
            platform: mac
            flags: --mac

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild electron esbuild

      - name: Take the version from the tag
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          case "$version" in
            [0-9]*) ;;
            *) echo "::error::'$version' is not a version number" && exit 1 ;;
          esac
          npm pkg set version="$version"
          echo "Building $version"

      - run: pnpm build

      - name: Package
        # No signing certificate, so tell electron-builder not to go looking
        # for one and stall the build waiting on the keychain.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder ${{ matrix.flags }} --publish never

      - name: Collect what people actually download
        shell: bash
        run: |
          mkdir -p dist-artifacts
          cd release
          for f in *.AppImage *.deb *.tar.gz *.dmg *.zip; do
            [ -f "$f" ] && cp "$f" ../dist-artifacts/
          done
          ls -lh ../dist-artifacts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: liseur-${{ matrix.platform }}
          path: dist-artifacts/*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # To create the release itself.
      contents: write
      # To vouch for what is in it: id-token proves to the attestation service
      # that this really is a run of this workflow.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: downloads
          merge-multiple: true

      # Records, in a public log, that these exact bytes came out of this
      # workflow at this commit. A checksum only says a file is unchanged
      # since someone wrote the checksum down; this says where it came from.
      # Done before SHA256SUMS is written, so the subjects are the downloads
      # themselves and not a file describing them.
      - name: Vouch for where these files came from
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: downloads/*

      - name: Checksums
        working-directory: downloads
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Write the release notes
        shell: bash
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Install"
            echo
            echo "On macOS, through Homebrew:"
            echo
            echo '```'
            echo "brew tap chmouel/liseur https://github.com/${GITHUB_REPOSITORY}"
            echo "brew install --cask chmouel/liseur/liseur"
            echo '```'
            echo
            echo "The build is not signed, so macOS refuses the copy Homebrew"
            echo "quarantines. Clear the flag once, as the cask reminds you, or pass"
            echo "\`--no-quarantine\` to the install line and never see it:"
            echo
            echo '```'
            echo "xattr -dr com.apple.quarantine /Applications/Liseur.app"
            echo '```'
            echo
            echo "Taking the \`.dmg\` matching your Mac (\`arm64\` for Apple silicon, \`x64\`"
            echo "for Intel) by hand works just as well."
            echo
            echo "On Arch Linux, install \`liseur-desktop-bin\` from the AUR."
            echo
            echo "On other Linux, download the \`.AppImage\`, make it executable and run it:"
            echo
            echo '```'
            echo "chmod +x liseur-desktop-*.AppImage && ./liseur-desktop-*.AppImage"
            echo '```'
            echo
            echo "On Debian and Ubuntu you can install the \`.deb\` instead, and the same"
            echo "Homebrew cask installs the AppImage where \`brew\` is what you already use."
            echo
            echo "Checksums for every file are in \`SHA256SUMS\`."
            echo
            echo "Every file is also signed by the workflow that built it. To check that a"
            echo "download really came from this repository, and not from someone in the"
            echo "middle:"
            echo
            echo '```'
            echo "gh attestation verify <file> --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "## Changes"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s' "$previous..${GITHUB_REF_NAME}"
            else
              git log --no-merges --pretty='- %s' -20
            fi
          } > NOTES.md
          cat NOTES.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: downloads/*
          body_path: NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

  homebrew:
    name: Update the Homebrew cask
    needs: publish
    # This repository is its own Homebrew tap, and Homebrew reads the cask
    # from the default branch rather than from the tag, so the cask has to be
    # moved forward on main once the release it describes exists. Prereleases
    # are skipped, or `brew upgrade` would hand one to everybody. A manual run
    # rehearses everything and stops short of the push.
    if: >-
      !cancelled() && !contains(github.ref_name, '-') &&
      ((startsWith(github.ref, 'refs/tags/v') && needs.publish.result == 'success') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      # The one job in this workflow that writes to the repository itself.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The tag is a detached commit; the cask has to land on the branch
          # Homebrew will read it from. The whole history, because the push
          # below may have to rebase onto whatever arrived in the meantime.
          ref: main
          fetch-depth: 0

      - name: Point the cask at the release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi

          # The release published its own checksums a moment ago, so the
          # downloads themselves need not be fetched again to be summed.
          curl -fsSL -o /tmp/SHA256SUMS \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/SHA256SUMS"

          node scripts/update-cask.mjs "$version" /tmp/SHA256SUMS

          # A cask that does not parse is a cask nobody can install, and the
          # mistake would otherwise surface on somebody else's machine. The
          # rewrite touches five lines and is unit-tested, so a runner without
          # Ruby is worth a warning rather than a failed release.
          if command -v ruby > /dev/null; then
            ruby -c Casks/liseur.rb
          else
            echo "::warning::no ruby on this runner, the cask was not parsed"
          fi
          git --no-pager diff -- Casks/liseur.rb

      - name: Commit it to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/liseur.rb

          if git diff --cached --quiet; then
            echo "the cask already describes this release"
            exit 0
          fi

          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          git commit -m "chore: point the Homebrew cask at ${version}"

          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "a manual run gets this far and no further"
            exit 0
          fi

          # main can move while a release is building, and losing the cask
          # update to a race would leave the tap a version behind until
          # somebody noticed.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 5))
          done
          echo "::error::could not push the cask update to main"
          exit 1

  aur:
    name: Update the AUR package
    needs: publish
    # Prereleases are skipped: an AUR version cannot contain a hyphen. A
    # manual run rehearses everything and stops short of the push.
    if: >-
      !cancelled() && !contains(github.ref_name, '-') &&
      ((startsWith(github.ref, 'refs/tags/v') && needs.publish.result == 'success') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git openssh

      - name: Write the package description
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://github.com/${GITHUB_REPOSITORY}" checkout

          # The release we just published already published its checksums,
          # so the 200 MB of tarballs need not be downloaded again.
          curl -fsSL -o SHA256SUMS \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/SHA256SUMS"
          sha_of() { awk -v f="$1" '$2 == f { print $1 }' SHA256SUMS; }

          sed \
            -e "s/@PKGVER@/${version}/g" \
            -e "s/@SHA_LICENSE@/$(sha256sum checkout/LICENSE | cut -d' ' -f1)/" \
            -e "s/@SHA_ICON@/$(sha256sum checkout/build/icon.png | cut -d' ' -f1)/" \
            -e "s/@SHA_X64@/$(sha_of "liseur-desktop-${version}-linux-x64.tar.gz")/" \
            -e "s/@SHA_ARM64@/$(sha_of "liseur-desktop-${version}-linux-arm64.tar.gz")/" \
            checkout/packaging/aur/PKGBUILD.in > PKGBUILD

          if grep -q '@[A-Z_]\+@' PKGBUILD; then echo "::error::a placeholder was left unfilled"; cat PKGBUILD; exit 1; fi

          # makepkg refuses to run as root, and rightly so.
          useradd -m builder
          chown -R builder .
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO
          cat PKGBUILD .SRCINFO

      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "::warning::no AUR key configured, skipping the AUR update"
            exit 0
          fi
          # Absolute paths throughout: ssh expands ~ from the passwd entry,
          # not from HOME, and in a container those are different places.
          ssh_dir="${PWD}/.aur-ssh"
          install -dm700 "$ssh_dir"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          # The AUR's published host key, pinned rather than fetched: asking
          # the server who it is and believing the answer proves nothing.
          printf '%s %s %s\n' aur.archlinux.org ssh-ed25519 \
            AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN \
            > "$ssh_dir/known_hosts"
          ssh-keygen -lf "$ssh_dir/known_hosts" |
            grep -q 'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4'
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"

          # Prove the key works before the fallback below can hide it.
          $GIT_SSH_COMMAND -o BatchMode=yes aur@aur.archlinux.org help > /dev/null

          git clone ssh://aur@aur.archlinux.org/liseur-desktop-bin.git aur || {
            mkdir aur && git -C aur init -q -b master
            git -C aur remote add origin ssh://aur@aur.archlinux.org/liseur-desktop-bin.git
          }
          cp PKGBUILD .SRCINFO aur/
          cd aur
          git config user.name 'Chmouel Boudjnah'
          git config user.email 'chmouel@chmouel.com'
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "the AUR already has this version"
            exit 0
          fi
          git commit -m "Update to $(sed -n 's/^pkgver=//p' PKGBUILD)"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "a manual run gets this far and no further"
            exit 0
          fi
          git push origin HEAD:master
