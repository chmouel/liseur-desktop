name: Release

# Pushing a version tag builds the downloadable applications and publishes
# them. Nothing here runs on ordinary pushes: releases are deliberate.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag is the single source of truth for the version. package.json is
# rewritten from it during the build, so the number on the download and the
# number in the About box can never disagree.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (dry run — nothing is published)'
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild electron esbuild

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

      - name: Install headless Electron deps
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgtk-3-0 libgbm1 libasound2t64

      - name: E2E tests
        run: xvfb-run --auto-servernum pnpm test:e2e

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both architectures come off one runner per platform: the app has
          # no native modules, so nothing needs compiling for the target.
          - os: ubuntu-latest
            platform: linux
            flags: --linux
          - os: macos-latest
            platform: mac
            flags: --mac

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild electron esbuild

      - name: Take the version from the tag
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          case "$version" in
            [0-9]*) ;;
            *) echo "::error::'$version' is not a version number" && exit 1 ;;
          esac
          npm pkg set version="$version"
          echo "Building $version"

      - run: pnpm build

      - name: Package
        # No signing certificate, so tell electron-builder not to go looking
        # for one and stall the build waiting on the keychain.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder ${{ matrix.flags }} --publish never

      - name: Collect what people actually download
        shell: bash
        run: |
          mkdir -p dist-artifacts
          cd release
          for f in *.AppImage *.deb *.tar.gz *.dmg *.zip; do
            [ -f "$f" ] && cp "$f" ../dist-artifacts/
          done
          ls -lh ../dist-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: liseur-${{ matrix.platform }}
          path: dist-artifacts/*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true

      - name: Checksums
        working-directory: downloads
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Write the release notes
        shell: bash
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Install"
            echo
            echo "**Linux** — download the \`.AppImage\`, make it executable, run it:"
            echo
            echo '```'
            echo "chmod +x liseur-desktop-*.AppImage && ./liseur-desktop-*.AppImage"
            echo '```'
            echo
            echo "Debian and Ubuntu users can install the \`.deb\` instead."
            echo
            echo "**macOS** — download the \`.dmg\` for your Mac (\`arm64\` for Apple silicon,"
            echo "\`x64\` for Intel) and drag Liseur to Applications. The build is not signed,"
            echo "so macOS will refuse it the first time. Clear the quarantine flag once:"
            echo
            echo '```'
            echo "xattr -dr com.apple.quarantine /Applications/Liseur.app"
            echo '```'
            echo
            echo "Checksums for every file are in \`SHA256SUMS\`."
            echo
            echo "## Changes"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s' "$previous..${GITHUB_REF_NAME}"
            else
              git log --no-merges --pretty='- %s' -20
            fi
          } > NOTES.md
          cat NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          files: downloads/*
          body_path: NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
