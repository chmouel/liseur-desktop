<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The reader iframe is a srcdoc document, and srcdoc inherits *this*
         CSP: book stylesheets and media load over liseur-epub:, so the
         publisher's typography survives. The iframe adds its own stricter
         policy (no scripts) on top. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' liseur-epub:; img-src 'self' data: liseur-cover: liseur-epub:; media-src 'self' liseur-epub:; connect-src 'self' liseur-epub:; font-src 'self' liseur-epub:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liseur</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
